<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Green Campus Sustainability Analytics Portal</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar">

            <div class="logo">🌿 Green Campus</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="catalog.html">Metrics</a></li>
                <li><a href="report.html">Reports</a></li>
            </ul>

        </nav>
    </header>

    <!-- Registration Form -->
    <div class="form-container">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Student / Employee ID</label>
                <input type="text" id="id" placeholder="Enter your ID">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Department</label>

                <select id="department">
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>Electrical</option>
                    <option>Administration</option>
                </select>

            </div>

            <div class="form-group">
                <label>Campus Location</label>

                <select id="campus">
                    <option value="">Select Campus</option>
                    <option>Main Campus</option>
                    <option>North Campus</option>
                    <option>South Campus</option>
                    <option>Research Center</option>
                </select>

            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
            </div>

            <button class="form-btn" type="submit">
                Register
            </button>

            <br><br>

            <button class="form-btn" type="reset">
                Reset
            </button>

        </form>

    </div>

    <!-- Footer -->
    <footer>

        <h3>Green Campus Sustainability Analytics Portal</h3>

        <p>Promoting a greener and smarter campus environment.</p>

        <br>

        <p>Email: support@greencampus.edu</p>

        <p>Phone: +91 123XXXX890</p>

        <br>

        <p>© 2026 Green Campus Sustainability Analytics Portal</p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
